# Every push to main: validate the decks, run every Java answer for real, and only if both pass, publish to GitHub Pages.
name: Test and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm test
      - name: Check every answer against real Java (hand-written + sampled from every template)
        # A different seed window each run, so over time the templates get tested on far more random values.
        run: SAMPLES=8 FIRST_SEED=$(( GITHUB_RUN_NUMBER * 1000 )) python3 tools/check_java.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
